<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Código — Brasil Doces do Vale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: #09090b;
            color: #e4e4e7;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #00A859, #005C2E);
            padding: 12px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        
        .header h1 {
            font-size: 18px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 12px;
            opacity: 0.9;
        }
        
        .controls {
            background: #18181b;
            padding: 12px 16px;
            border-bottom: 1px solid #27272a;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        select, input {
            background: #27272a;
            color: #e4e4e7;
            border: 1px solid #3f3f46;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
        }
        
        button {
            background: #00A859;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #005C2E;
        }
        
        button.danger {
            background: #ef4444;
        }
        
        button.danger:hover {
            background: #dc2626;
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            gap: 0;
        }
        
        .file-list {
            width: 200px;
            background: #18181b;
            border-right: 1px solid #27272a;
            overflow-y: auto;
            padding: 12px 0;
        }
        
        .file-item {
            padding: 10px 16px;
            cursor: pointer;
            border-left: 3px solid transparent;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background 0.15s;
        }
        
        .file-item:hover {
            background: #27272a;
        }
        
        .file-item.active {
            background: #00A859;
            color: white;
            border-left-color: #FACC15;
        }
        
        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .filename {
            background: #18181b;
            padding: 10px 16px;
            border-bottom: 1px solid #27272a;
            font-size: 12px;
            color: #a1a1a1;
        }
        
        textarea {
            flex: 1;
            background: #09090b;
            color: #e4e4e7;
            border: none;
            padding: 16px;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            line-height: 1.5;
            outline: none;
        }
        
        .status {
            background: #18181b;
            padding: 8px 16px;
            border-top: 1px solid #27272a;
            font-size: 11px;
            color: #a1a1a1;
        }
        
        .status.success {
            color: #4ade80;
        }
        
        .status.error {
            color: #ef4444;
        }
        
        @media (max-width: 768px) {
            .file-list {
                width: 120px;
            }
            
            .controls {
                flex-direction: column;
                align-items: flex-start;
            }
            
            select, input {
                width: 100%;
            }
            
            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🍫 Editor de Código</h1>
        <p>Brasil Doces do Vale — Edite arquivos do projeto</p>
    </div>
    
    <div class="controls">
        <select id="folderSelect" onchange="loadFolder(this.value)">
            <option value="">Escolha uma pasta...</option>
            <option value="frontend/src">Frontend - src/</option>
            <option value="frontend/src/components">Frontend - components/</option>
            <option value="frontend/src/views/client">Frontend - client/</option>
            <option value="frontend/src/views/admin">Frontend - admin/</option>
            <option value="backend/src">Backend - src/</option>
            <option value="backend/src/controllers">Backend - controllers/</option>
            <option value="backend/src/routes">Backend - routes/</option>
        </select>
        <button onclick="reloadFiles()">🔄 Recarregar</button>
        <button class="danger" onclick="clearCache()">🗑️ Limpar Cache</button>
    </div>
    
    <div class="container">
        <div class="file-list" id="fileList">
            <div style="padding: 16px; text-align: center; color: #666;">
                Selecione uma pasta
            </div>
        </div>
        
        <div class="editor-area">
            <div class="filename" id="filename">Nenhum arquivo selecionado</div>
            <textarea id="editor" placeholder="Abra um arquivo para editar..."></textarea>
            <div class="status" id="status">Pronto</div>
        </div>
    </div>
    
    <script>
        let currentFile = null;
        let files = {};
        let unsavedChanges = false;
        
        const editor = document.getElementById('editor');
        const filename = document.getElementById('filename');
        const status = document.getElementById('status');
        const fileList = document.getElementById('fileList');
        
        // Simulação de arquivos (em produção, isso viria de uma API)
        const mockFiles = {
            'frontend/src': {
                'App.tsx': `import { useEffect, useState } from "react";\nimport { BrowserRouter, Routes, Route, Navigate } from "react-router-dom";\nimport { HomePage } from "./views/client/HomePage";\nimport { LoginPage } from "./views/admin/LoginPage";\n// ... resto do código`,
                'main.tsx': `import React from "react";\nimport ReactDOM from "react-dom/client";\nimport { App } from "./App";\nimport "./index.css";\n\nReactDOM.createRoot(document.getElementById("root")!).render(\n  <React.StrictMode>\n    <App />\n  </React.StrictMode>\n);`,
                'index.css': `@tailwind base;\n@tailwind components;\n@tailwind utilities;\n\nhtml, body, #root {\n  height: 100%;\n}\n\nbody {\n  background-color: #09090b;\n}`
            },
            'frontend/src/components': {
                'Header.tsx': `import { ShoppingCart } from "lucide-react";\nimport logo from "../assets/logo.png";\nimport { useCartStore } from "../store/cartStore";\n\ninterface HeaderProps {\n  onOpenCart: () => void;\n}\n\nexport function Header({ onOpenCart }: HeaderProps) {\n  const totalItems = useCartStore((s) => s.totalItems());\n\n  return (...)\n}`,
                'Footer.tsx': `export function Footer() {\n  return (\n    <footer className="...">...</footer>\n  );\n}`,
                'ProductCard.tsx': `import { Plus } from "lucide-react";\nimport { Product } from "../types";\n\nexport function ProductCard({ product }: { product: Product }) {\n  // Component code\n}`
            },
            'backend/src': {
                'server.ts': `import { app } from "./app";\nimport { env } from "./config/env";\n\napp.listen(env.port, () => {\n  console.log(\\`🍫 Brasil Doces do Vale API rodando em http://localhost:\\${env.port}\\`);\n});`,
                'app.ts': `import express from "express";\nimport cors from "cors";\nimport { router } from "./routes";\nimport { errorHandler } from "./middleware/errorHandler";\nimport { env } from "./config/env";\n\nexport const app = express();\n\napp.use(cors({ origin: env.corsOrigin }));\napp.use(express.json());\napp.use(router);\n\napp.use(errorHandler);`
            }
        };
        
        function loadFolder(folderPath) {
            if (!folderPath) return;
            
            fileList.innerHTML = '';
            const folderFiles = mockFiles[folderPath] || {};
            
            Object.keys(folderFiles).forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.textContent = file;
                div.onclick = () => openFile(file, folderFiles[file], folderPath);
                fileList.appendChild(div);
            });
        }
        
        function openFile(file, content, folder) {
            currentFile = `${folder}/${file}`;
            files[currentFile] = content;
            
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            filename.textContent = currentFile;
            editor.value = content;
            unsavedChanges = false;
            updateStatus('Aberto: ' + file, '');
        }
        
        editor.addEventListener('input', () => {
            unsavedChanges = true;
            updateStatus('Não salvo...', 'warning');
        });
        
        function reloadFiles() {
            const folder = document.getElementById('folderSelect').value;
            if (folder) loadFolder(folder);
            updateStatus('Arquivos recarregados', 'success');
        }
        
        function clearCache() {
            localStorage.clear();
            location.reload();
        }
        
        function updateStatus(msg, type) {
            status.textContent = msg;
            status.className = 'status';
            if (type === 'success') status.classList.add('success');
            if (type === 'warning') status.classList.add('warning');
            if (type === 'error') status.classList.add('error');
        }
        
        // Salvar no localStorage
        window.addEventListener('beforeunload', () => {
            if (unsavedChanges && currentFile) {
                localStorage.setItem('file_' + currentFile, editor.value);
            }
        });
        
        // Restaurar do localStorage
        function restoreFromCache() {
            const saved = localStorage.getItem('file_' + currentFile);
            if (saved) {
                editor.value = saved;
                updateStatus('Restaurado do cache', 'success');
            }
        }
    </script>
</body>
</html>
